name: AntiAFK
version: '${project.version}'
main: clre20.antiAFK.AntiAFK
api-version: '26.1'
author: clre20
description: 依範圍設定可否掛機，掛機時自動執行指令。
website: https://github.com/clre20/AntiAFK

commands:
  antiafk:
    description: AntiAFK 主指令
    usage: /<command> help
    aliases: [aafk]

permissions:
  antiafk.*:
    description: AntiAFK 所有權限
    default: op
    children:
      antiafk.admin: true
      antiafk.reload: true
      antiafk.version: true
      antiafk.bypass: true
  antiafk.admin:
    description: 管理範圍、世界預設、開啟管理介面
    default: op
  antiafk.reload:
    description: 重新載入 config.yml 與 messages.yml
    default: op
  antiafk.version:
    description: 檢查更新，並在登入時收到新版本提醒
    default: op
  antiafk.bypass:
    description: 不受掛機限制
    default: op

softdepend: [ HttpHub ]
