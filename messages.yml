# ==========================================================
#  AntiAFK 訊息檔
#  支援 & 色碼，{變數} 會自動替換。留空字串代表不發送該訊息。
#  缺少的項目會在啟動或 /antiafk reload 時自動補齊。
# ==========================================================

prefix: "&8[&cAntiAFK&8] &r"

mode:
  allow: "&a可掛機"
  deny: "&c禁止掛機"

state:
  "on": "&a開啟"
  "off": "&7關閉"

placeholder:
  # 不在任何範圍內（套用世界預設）時，{region} / %region% 顯示的文字
  no-region: "世界預設"

afk:
  warning-chat: "&e你已經掛機太久了！&f{seconds} &e秒內沒有轉動視角或發言就會被處置。"
  warning-title: "&c禁止掛機"
  warning-subtitle: "&e{seconds} 秒內請轉動視角"
  cancelled: "&a偵測到活動，已取消掛機處置。"

select:
  enabled: "&a已進入選取模式：&f空手右鍵&a點方塊設定點 1，再點一次設定點 2。"
  disabled: "&7已離開選取模式。"
  pos1: "&a點 1 已設定：&f{x}, {y}, {z}"
  pos2: "&a點 2 已設定：&f{x}, {y}, {z} &7（輸入 /antiafk create <名稱> <allow|deny> 建立範圍）"
  incomplete: "&c請先用 /antiafk select 選好兩個點（兩點須在同一個世界）。"

region:
  created: "&a已建立範圍 &f{region}&a：{mode}&a，優先度 &f{priority}"
  deleted: "&a已刪除範圍 &f{region}"
  updated: "&a已更新範圍 &f{region}"
  exists: "&c範圍 &f{region} &c已經存在。"
  not-found: "&c找不到範圍 &f{region}"
  invalid-name: "&c範圍名稱只能使用英文、數字、底線與減號，長度 1–32。"
  limit: "&c這個世界的範圍數量已達上限（{max}）。"
  world-missing: "&c找不到世界 &f{world}"
  profile-not-found: "&c找不到動作組 &f{profile}&c，可用：&f{profiles}"
  teleported: "&a已傳送到範圍 &f{region}"

world:
  set: "&a世界 &f{world} &a的預設已設為 {mode}"

list:
  empty: "&7目前沒有任何範圍。"
  header: "&e範圍列表（共 {count} 個）："
  entry: "&7- &f{region} &7[{world}] {mode} &7優先度 &f{priority}"

info:
  body: "&e範圍 &f{region}\n&7世界：&f{world}\n&7座標：&f{min} &7~ &f{max}\n&7模式：{mode}\n&7優先度：&f{priority}\n&7掛機時間：&f{time}\n&7動作組：&f{profile}"

check:
  result: "&e{player} &7位於 &f{world} &7/ &f{region}&7：{mode}&7，已閒置 &f{idle} &7秒，豁免：{bypass}"

command:
  no-permission: "&c你沒有權限使用這個指令。"
  player-only: "&c這個指令只能由玩家執行。"
  unknown: "&c未知的子指令，請輸入 /{label} help"
  invalid-number: "&c請輸入 {min} 到 {max} 之間的整數。"
  player-not-found: "&c找不到線上玩家 &f{player}"
  reloaded: "&a已重新載入 config.yml 與 messages.yml。"

usage:
  create: "&c用法：/antiafk create <名稱> <allow|deny> [優先度]"
  delete: "&c用法：/antiafk delete <名稱>"
  set: "&c用法：/antiafk set <名稱> <mode|priority|time|profile> <值>"
  info: "&c用法：/antiafk info <名稱>"
  tp: "&c用法：/antiafk tp <名稱>"
  world: "&c用法：/antiafk world <allow|deny|reset> [世界]"
  check: "&c用法：/antiafk check <玩家>"

help:
  header: "&e===== AntiAFK 指令 ====="
  select: "&f/{label} select &7- 切換選取模式（空手右鍵點方塊）"
  create: "&f/{label} create <名稱> <allow|deny> [優先度] &7- 用選取的範圍建立"
  delete: "&f/{label} delete <名稱> &7- 刪除範圍"
  set: "&f/{label} set <名稱> <mode|priority|time|profile> <值> &7- 修改範圍"
  list: "&f/{label} list &7- 列出所有範圍"
  info: "&f/{label} info <名稱> &7- 查看範圍資訊"
  tp: "&f/{label} tp <名稱> &7- 傳送到範圍"
  world: "&f/{label} world <allow|deny|reset> [世界] &7- 設定世界預設"
  check: "&f/{label} check [玩家] &7- 查看玩家所在位置的判定"
  gui: "&f/{label} gui &7- 開啟管理介面"
  reload: "&f/{label} reload &7- 重新載入設定"
  version: "&f/{label} version &7- 檢查更新"

update:
  checking: "&7正在檢查更新…"
  outdated: "&e有新版本 &fv{latest}&e（目前 v{current}）：&f{url}"
  up-to-date: "&a目前已是最新版本 v{current}。"
  dev-build: "&b目前版本 v{current} 比 GitHub 最新版 v{latest} 新（開發版）。"
  no-release: "&7GitHub 尚未發布任何 Release，目前版本 v{current}。"
  failed: "&c檢查更新失敗，請稍後再試。"
  join-notify: "&eAntiAFK 有新版本 &fv{latest}&e（目前 v{current}）：&f{url}"

gui:
  filler: " "
  close: "&c關閉"
  region-name: "&f{region}"
  time-global: "{seconds} 秒（使用全域設定）"
  time-custom: "{seconds} 秒"
  profile-default: "{profile}（預設）"
  list:
    title: "&8AntiAFK 範圍管理 ({page}/{pages})"
    region-lore:
      - "&7世界：&f{world}"
      - "&7座標：&f{min} &7~ &f{max}"
      - "&7模式：{mode}"
      - "&7優先度：&f{priority}"
      - "&7掛機時間：&f{time}"
      - "&7動作組：&f{profile}"
      - ""
      - "&e左鍵編輯"
    prev: "&e上一頁"
    next: "&e下一頁"
    world: "&e目前世界預設：{mode}"
    world-lore:
      - "&7世界：&f{world}"
      - "&7不在任何範圍內時套用此設定"
      - ""
      - "&e左鍵切換"
    select: "&e選取模式：{state}"
    select-lore:
      - "&7開啟後空手右鍵點方塊"
      - "&7輪流設定點 1、點 2"
      - ""
      - "&e左鍵切換"
  edit:
    title: "&8編輯範圍：{region}"
    info-lore:
      - "&7世界：&f{world}"
      - "&7座標：&f{min} &7~ &f{max}"
      - "&7模式：{mode}"
      - "&7優先度：&f{priority}"
      - "&7掛機時間：&f{time}"
      - "&7動作組：&f{profile}"
    mode: "&e模式：{mode}"
    mode-lore:
      - "&e左鍵切換 可掛機 / 禁止掛機"
    priority-down: "&c優先度 -1"
    priority-up: "&a優先度 +1"
    priority-lore:
      - "&7目前：&f{priority}"
      - "&7範圍重疊時，數字大的優先"
    profile: "&e動作組：&f{profile}"
    profile-lore:
      - "&7可用：&f{profiles}"
      - "&e左鍵切換到下一個"
    time-down: "&c掛機時間 -{step} 秒"
    time-up: "&a掛機時間 +{step} 秒"
    time-lore:
      - "&7目前：&f{time}"
    time-reset: "&e改用全域掛機時間"
    time-reset-lore:
      - "&7全域設定：&f{seconds} 秒"
    back: "&e返回列表"
    teleport: "&b傳送到此範圍"
    delete: "&c刪除範圍"
    delete-lore:
      - "&7需要再點一次確認"
    delete-confirm: "&4再點一次確認刪除"
    delete-confirm-lore:
      - "&c此操作無法復原"
